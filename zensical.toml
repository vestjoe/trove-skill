[project]
site_name = "Trove"
site_description = "An agent skill that keeps CTF and lab tool output as cited records."
site_url = "https://vestjoe.github.io/trove-skill/"
repo_url = "https://github.com/vestjoe/trove-skill"
repo_name = "vestjoe/trove-skill"
docs_dir = "docs"
exclude_docs = """
SPEC.md
"""
nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Tutorial" = [
    { "Walkthrough: castelblack" = "tutorial.md" },
  ] },
  { "How-to" = [
    { "Search records" = "searching.md" },
    { "Notes and finding status" = "notes.md" },
    { "Troubleshooting" = "troubleshooting.md" },
  ] },
  { "Reference" = [
    { "Commands" = "commands.md" },
    { "Tools Trove reads" = "tools.md" },
  ] },
  { "Explanation" = [
    { "How Trove works" = "how-it-works.md" },
  ] },
]

[project.theme]
language = "en"
logo = "brand/trove-mark.svg"
favicon = "brand/trove-mark.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
